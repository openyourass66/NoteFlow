[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noteflow"
version = "0.1.0"
description = "Local melody transcription for Windows"
requires-python = ">=3.11,<3.12"
dependencies = [
    "basic-pitch==0.4.0",
    "onnxruntime==1.31.1",
    "librosa==0.11.0",
    "mido==1.3.3",
    "setuptools==79.0.1",  # Basic Pitch's resampy dependency imports pkg_resources.
]

[project.optional-dependencies]
desktop = ["PySide6==6.12.0"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
